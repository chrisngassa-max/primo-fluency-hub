[auth]
  site_url = "https://captcf.fr"
  additional_redirect_urls = [
    "https://captcf.fr/**",
    "https://www.captcf.fr/**",
    "https://captcf.lovable.app/**",
    "https://captcf.lovable.app/#/reset-password",
    "https://captcf.lovable.app/auth/relay-reset",
    "http://localhost:3000/**",
    "http://localhost:8080/**",
    "http://127.0.0.1:3000/**",
    "http://127.0.0.1:8080/**",
  ]

[auth.email]
  enable_signup = true
  double_confirm_changes = true
  enable_confirmations = true
  secure_password_change = false
  max_frequency = "1m0s"
  otp_length = 8
  otp_expiry = 3600

[auth.mfa.totp]
  enroll_enabled = true
  verify_enabled = true

[storage.vector]
  enabled = false

