<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Repères de 1789 à 1792">
  <title>Repères de 1789 à 1792</title>
  <rect x="0" y="0" width="900" height="240" fill="#ffffff" />
  <line x1="60" y1="140" x2="840" y2="140" stroke="#374151" stroke-width="3" />
  <circle cx="220" cy="140" r="8" fill="#1e3a8a" />
  <rect x="110" y="60" width="240" height="60" fill="#dbeafe" rx="8" />
  <text x="230" y="85" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="middle">1789 — Révolution</text>
  <text x="230" y="105" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">Déclaration des droits</text>
  <circle cx="640" cy="140" r="8" fill="#b91c1c" />
  <rect x="520" y="60" width="240" height="60" fill="#fee2e2" rx="8" />
  <text x="640" y="85" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="middle">1792 — République</text>
  <text x="640" y="105" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">première proclamation</text>
  <text x="220" y="180" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">fin de la monarchie absolue</text>
</svg>