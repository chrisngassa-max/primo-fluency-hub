<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Parcours scolaire et instruction obligatoire">
  <title>Parcours scolaire et instruction obligatoire</title>
  <rect x="0" y="0" width="900" height="260" fill="#ffffff" />
  <rect x="40" y="90" width="200" height="90" fill="#dcfce7" rx="8" />
  <text x="140" y="130" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="middle">École maternelle</text>
  <text x="140" y="150" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">(dès 3 ans)</text>
  <line x1="240" y1="135" x2="320" y2="135" stroke="#374151" stroke-width="3" />
  <rect x="320" y="90" width="200" height="90" fill="#fef9c3" rx="8" />
  <text x="420" y="135" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="middle">École élémentaire</text>
  <line x1="520" y1="135" x2="600" y2="135" stroke="#374151" stroke-width="3" />
  <rect x="600" y="90" width="200" height="90" fill="#fee2e2" rx="8" />
  <text x="700" y="130" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="middle">Collège</text>
  <text x="700" y="150" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">(jusqu&apos;à 16 ans)</text>
  <text x="40" y="50" font-size="16" font-family="sans-serif" fill="#111827" text-anchor="start">Instruction obligatoire de 3 à 16 ans</text>
</svg>