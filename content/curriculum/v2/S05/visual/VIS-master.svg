<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Immeuble et médiation de voisinage">
  <title>Immeuble et médiation de voisinage</title>
  <rect x="0" y="0" width="900" height="320" fill="#ffffff" />
  <rect x="60" y="40" width="240" height="240" fill="#eef2ff" rx="6" />
  <line x1="60" y1="120" x2="300" y2="120" stroke="#94a3b8" stroke-width="2" />
  <line x1="60" y1="200" x2="300" y2="200" stroke="#94a3b8" stroke-width="2" />
  <text x="180" y="90" font-size="13" font-family="sans-serif" fill="#111827" text-anchor="middle">Appartement 3</text>
  <text x="180" y="170" font-size="13" font-family="sans-serif" fill="#111827" text-anchor="middle">Appartement 2</text>
  <text x="180" y="250" font-size="13" font-family="sans-serif" fill="#111827" text-anchor="middle">Appartement 1</text>
  <rect x="420" y="150" width="360" height="90" fill="#dcfce7" rx="8" />
  <text x="600" y="190" font-size="15" font-family="sans-serif" fill="#111827" text-anchor="middle">Table de médiation</text>
  <text x="600" y="215" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">(solution à l&apos;amiable)</text>
  <line x1="300" y1="195" x2="420" y2="195" stroke="#374151" stroke-width="3" />
</svg>