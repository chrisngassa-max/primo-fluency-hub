<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Séparation des pouvoirs">
  <title>Séparation des pouvoirs</title>
  <rect x="0" y="0" width="900" height="260" fill="#ffffff" />
  <rect x="80" y="80" width="200" height="70" fill="#dbeafe" rx="8" />
  <text x="180" y="120" font-size="13" font-family="sans-serif" fill="#111827" text-anchor="middle">Législatif</text>
  <rect x="350" y="80" width="200" height="70" fill="#dcfce7" rx="8" />
  <text x="450" y="120" font-size="13" font-family="sans-serif" fill="#111827" text-anchor="middle">Exécutif</text>
  <rect x="620" y="80" width="200" height="70" fill="#fee2e2" rx="8" />
  <text x="720" y="120" font-size="13" font-family="sans-serif" fill="#111827" text-anchor="middle">Judiciaire</text>
  <text x="450" y="200" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="middle">État de droit</text>
