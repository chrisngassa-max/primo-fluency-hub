  <rect x="360" y="130" width="180" height="70" fill="#dbeafe" rx="10" />
  <text x="450" y="160" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="middle">Impôts et taxes</text>
  <text x="450" y="182" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">(contribution de tous)</text>
  <line x1="360" y1="165" x2="200" y2="70" stroke="#374151" stroke-width="2" />
