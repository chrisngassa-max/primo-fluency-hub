<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Notification et pièce manquante (document fictif)">
  <title>Notification et pièce manquante (document fictif)</title>
  <rect x="0" y="0" width="900" height="300" fill="#ffffff" />
  <rect x="130" y="40" width="640" height="220" fill="#fef9c3" rx="8" />
  <text x="160" y="75" font-size="16" font-family="sans-serif" fill="#111827" text-anchor="start">Notification (document pédagogique fictif)</text>
  <line x1="160" y1="92" x2="740" y2="92" stroke="#a16207" stroke-width="2" />
  <text x="160" y="130" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="start">Objet : dossier de titre de séjour</text>
  <text x="160" y="165" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="start">Pièce demandée : justificatif de domicile</text>
  <text x="160" y="200" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="start">À transmettre avant : la date d&apos;échéance</text>
  <text x="160" y="235" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="start">Réponse : par courriel ou rendez-vous</text>
</svg>