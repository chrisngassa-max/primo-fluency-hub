<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Se protéger : noter, signaler, être accompagné">
  <title>Se protéger : noter, signaler, être accompagné</title>
  <rect x="0" y="0" width="900" height="240" fill="#ffffff" />
  <rect x="40" y="90" width="220" height="80" fill="#dbeafe" rx="8" />
  <text x="150" y="125" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="middle">1. Noter les faits</text>
  <text x="150" y="148" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">dates, preuves</text>
  <line x1="260" y1="130" x2="320" y2="130" stroke="#374151" stroke-width="3" />
  <rect x="320" y="90" width="220" height="80" fill="#dcfce7" rx="8" />
  <text x="430" y="125" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="middle">2. Signaler</text>
  <text x="430" y="148" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">service ou association</text>
  <line x1="540" y1="130" x2="600" y2="130" stroke="#374151" stroke-width="3" />
  <rect x="600" y="90" width="250" height="80" fill="#fef9c3" rx="8" />
  <text x="725" y="125" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="middle">3. Être accompagné</text>
  <text x="725" y="148" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">et protégé</text>
  <text x="40" y="50" font-size="16" font-family="sans-serif" fill="#111827" text-anchor="start">Égalité et dignité : personne n&apos;est seul</text>
</svg>