<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Arbre de décision civique">
  <title>Arbre de décision civique</title>
  <rect x="0" y="0" width="900" height="320" fill="#ffffff" />
  <rect x="350" y="20" width="200" height="50" fill="#e0e7ff" rx="8" />
  <text x="450" y="50" font-size="14" font-family="sans-serif" fill="#111827" text-anchor="middle">Lire la question</text>
  <line x1="400" y1="70" x2="280" y2="120" stroke="#374151" stroke-width="2" />
  <line x1="500" y1="70" x2="620" y2="120" stroke="#374151" stroke-width="2" />
  <rect x="180" y="120" width="200" height="50" fill="#dcfce7" rx="8" />
  <text x="280" y="150" font-size="13" font-family="sans-serif" fill="#111827" text-anchor="middle">Connaissance</text>
  <rect x="520" y="120" width="200" height="50" fill="#fef9c3" rx="8" />
  <text x="620" y="150" font-size="13" font-family="sans-serif" fill="#111827" text-anchor="middle">Situation</text>
  <rect x="520" y="220" width="200" height="50" fill="#fee2e2" rx="8" />
  <text x="620" y="245" font-size="12" font-family="sans-serif" fill="#111827" text-anchor="middle">Conduite conforme ?</text>
</svg>